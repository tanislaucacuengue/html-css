<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de tabelas</title>
    <style>
        body{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        font-size: 1.2em;
    }

    table{
        border-collapse: collapse;
        width: 550px;
    }

    caption{
        text-align: left;
        font-size: 0.6em;
        margin: 5px;
    }

    thead th{
        background-color: #6e6e6e;
        color: white;
    }

    td, th{
        border: 1px solid black;
        padding: 5px;
        text-align: center;
    }

    col.cnome{
        background-color: skyblue;
    }

    col.cidade{
        background-color: lightgray;
    }
    </style>
</head>
<body>

    <h1>Exercícios de tabelas</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>

        <caption>Cadastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Benjamim Cacuengue</td>
            <td>M</td>
            <td>17</td>
            <td>Engenheiro Informático</td>
        </tr>

        <tr>
            <td>Rosária Cacuengue</td>
            <td>F</td>
            <td>18</td>
            <td>Analista</td>
        </tr>

        <tr>
            <td>Vilma Cacuengue</td>
            <td>F</td>
            <td>11</td>
            <td>Advogada</td>
        </tr>

        <tr>
            <td>Laurindo Cacuengue</td>
            <td>M</td>
            <td>0</td>
            <td>Desconhecida</td>
        </tr>
    </table>
    
</body>
</html>
